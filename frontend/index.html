<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Things HR</title>

    <!-- Connects the shared stylesheet used to format the interface -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Application header -->
    <header class="site-header">
        <div class="navbar">
            <h1 class="navbar-header" id="page-title">
            </h1>

            <!-- Workspace selection, independent of page navigation -->
            <div class="workspace-control" hidden>
                <label for="workspace-select">Workspace</label>
                <select id="workspace-select" aria-label="Select workspace">
                </select>
            </div>

            <!-- Hamburger Button -->
            <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Open navigation menu"
                aria-expanded="false" aria-controls="hamburger-menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- Navigation Menu -->
        <nav id="hamburger-menu" class="hamburger-menu" aria-label="Main navigation">
        </nav>
    </header>

    <main id="main_content">
        <section id="workspace-identity" class="workspace-identity" aria-label="Current workspace identity" hidden>
        </section>

        <div id="contentArea">
        </div>
    </main>



    <!-- Sign Out Confirmation Dialog -->
    <dialog id="sign-out-dialog" class="sign-out-dialog" aria-labelledby="sign-out-title"
        aria-describedby="sign-out-description">

        <h2 id="sign-out-title">Sign Out?</h2>

        <p id="sign-out-description">
            Are you sure you want to sign out of All Things HR?
        </p>

        <p id="sign-out-error" role="alert" hidden></p>

        <div class="sign-out-actions">
            <button type="button" id="cancel-sign-out">
                Cancel
            </button>

            <button type="button" id="confirm-sign-out">
                Sign Out
            </button>
        </div>
    </dialog>




    <!-- Handles frontend behavior and communication with the backend -->
    <script type="module" src="js/app.js"></script>


</body>

</html>
