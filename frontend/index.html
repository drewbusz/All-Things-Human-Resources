<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Things HR</title>

    <!-- Connects the shared stylesheet used to format the interface -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Application header -->
    <header class="site-header">
        <div class="navbar">
            <h1 class="navbar-header" id="page-title">
            </h1>

            <!-- Workspace selection, independent of page navigation -->
<div class="workspace-control">
    <label for="workspace-select">Workspace</label>

    <select id="workspace-select" aria-label="Select workspace">
        <option value="processing">HR Processing</option>
        <option value="authorized_staff">Authorized Staff</option>
        <option value="employee">Employee</option>
        <option value="manager">Management</option>
    </select>
</div>

            <!-- Hamburger Button -->
            <button id="menu-toggle"
                    class="menu-toggle"
                    type="button"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="hamburger-menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- Navigation Menu -->
        <nav id="hamburger-menu"
             class="hamburger-menu"
             aria-label="Main navigation">
        </nav>
    </header>

    <main id="main_content">
        <div id="contentArea">

        </div>
    </main>
    <!-- Handles frontend behavior and communication with the backend -->
    <script type="module" src="js/app.js"></script>


</body>
</html>
